<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My WordNet</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; overflow: hidden; }
  body { background: #f5f7fb; color: #202124; }
  #app { display: flex; height: 100vh; }
  #sidebar {
    width: 320px; background: white; border-right: 1px solid #ddd;
    padding: 18px; overflow-y: auto; z-index: 10;
  }
  #tabs {
    display: flex; align-items: center; gap: 5px; padding: 7px 10px;
    background: white; border-bottom: 1px solid #ddd; overflow-x: auto;
    min-height: 48px;
  }
  .tab {
    flex: 0 0 auto; border: 1px solid #d0d3d8; background: #f3f4f6;
    color: #333; border-radius: 7px; padding: 7px 10px; cursor: pointer;
    font-size: 13px; max-width: 180px; white-space: nowrap;
  }
  .tab.active { background: #202124; color: white; border-color: #202124; }
  .tab-close {
    display: inline-block; margin-left: 7px; font-weight: bold; opacity: .7;
    cursor: pointer;
  }
  .tab-close:hover { opacity: 1; }
  #newTabButton {
    flex: 0 0 auto; width: 34px; padding: 7px 0; margin: 0;
    background: #1a73e8; color: white; border-radius: 7px;
  }

  h1 { margin: 0 0 6px; font-size: 24px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 18px; }
  section { border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }
  label { display: block; font-size: 12px; font-weight: bold; margin: 9px 0 5px; }
  input, select, textarea, button {
    width: 100%; font: inherit; border-radius: 7px; border: 1px solid #ccc;
    padding: 9px;
  }
  textarea { min-height: 70px; resize: vertical; }
  button { cursor: pointer; background: #202124; color: white; border: 0; margin-top: 8px; }
  button.secondary { background: #eee; color: #222; }
  button.danger { background: #c62828; }
  .row { display: flex; gap: 7px; }
  .row > * { flex: 1; }
  #stats { font-size: 12px; color: #666; margin-top: 12px; }
  #searchResults { margin-top: 8px; }
  .result {
    padding: 7px; border-radius: 6px; cursor: pointer; background: #f1f3f4;
    margin-top: 5px; font-size: 13px;
  }
  .result:hover { background: #e4e7eb; }
  #canvas { position: relative; flex: 1; overflow: hidden; }
  #graph {
    position: absolute; inset: 0; cursor: grab;
    background-image: radial-gradient(#d8dce3 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #graph.dragging { cursor: grabbing; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .edge { stroke: #9aa0a6; stroke-width: 2; }
  .node {
    position: absolute; min-width: 120px; max-width: 220px; padding: 10px 13px;
    transform: translate(-50%, -50%); border-radius: 14px; background: white;
    border: 2px solid #5f6368; box-shadow: 0 3px 12px #0002;
    cursor: move; user-select: none;
  }
  .node.selected { border-color: #1a73e8; box-shadow: 0 0 0 3px #1a73e833, 0 3px 12px #0002; }
  .nodeDelete {
    position: absolute; top: -9px; right: -9px; width: 23px; height: 23px;
    padding: 0; margin: 0; border: 0; border-radius: 50%;
    background: #c62828; color: white; font-size: 16px; line-height: 23px;
    cursor: pointer; display: none; z-index: 3;
  }
  .node:hover .nodeDelete, .node.selected .nodeDelete { display: block; }
  .nodeDelete:hover { background: #a51f1f; }
  .word { font-weight: bold; font-size: 15px; }
  .type { font-size: 10px; color: #666; margin-top: 3px; }
  .definition { font-size: 11px; color: #555; margin-top: 5px; line-height: 1.35; }
  #hint {
    position: absolute; right: 15px; bottom: 15px; background: #ffffffdd;
    border: 1px solid #ddd; border-radius: 8px; padding: 8px 11px;
    font-size: 12px; color: #666; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>My WordNet</h1>
    <div class="subtitle">A personal word relationship map. Use the tabs above the map to create separate WordNets.</div>

    <section>
      <strong>Add a word</strong>
      <label>Word</label>
      <input id="wordInput" placeholder="e.g. happy">
      <label>Part of speech</label>
      <select id="typeInput">
        <option>noun</option><option>verb</option><option>adjective</option>
        <option>adverb</option><option>phrase</option><option>other</option>
      </select>
      <label>Definition / note</label>
      <textarea id="definitionInput" placeholder="Your own definition or note..."></textarea>
      <button onclick="addWord()">Add word</button>
    </section>

    <section>
      <strong>Connect words</strong>
      <label>From</label>
      <select id="fromInput"></select>
      <label>Relationship</label>
      <select id="relationInput">
        <option>synonym</option>
        <option>antonym</option>
        <option>related</option>
        <option>is-a</option>
        <option>part-of</option>
        <option>causes</option>
        <option>example-of</option>
        <option>custom</option>
      </select>
      <label>To</label>
      <select id="toInput"></select>
      <button onclick="addConnection()">Connect</button>
    </section>

    <section>
      <strong>Search</strong>
      <input id="searchInput" placeholder="Search your words..." oninput="searchWords()">
      <div id="searchResults"></div>
    </section>

    <section>
      <button class="secondary" onclick="exportData()">Export JSON</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">Import JSON</button>
      <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="danger" onclick="clearAll()">Clear All Words</button>
    </section>

    <section id="selectedSection" style="display:none;">
      <strong>Selected word</strong>
      <div id="selectedWord" style="font-size:14px; margin-top:8px;"></div>
      <button class="danger" onclick="deleteSelected()">Delete Selected Word</button>
    </section>

    <div id="stats"></div>
  </aside>

  <main id="canvas">
    <div id="tabs"></div>
    <div id="graph">
      <svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
    <div id="hint">Drag nodes • Drag empty space to pan • Double-click a node to edit</div>
  </main>
</div>

<script>
const STORAGE_KEY = "my-wordnet-tabs-v2";

let tabsData = loadTabs();
let activeTabId = tabsData.activeTabId;
let selected = null;
let nodeDrag = null;
let canvasDrag = null;

let pan = getActiveTab().pan || {x: 0, y: 0};

function uid(prefix = "id") {
  return prefix + "_" + Date.now().toString(36) + "_" +
         Math.random().toString(36).slice(2, 8);
}

function makeDefaultTab(name = "My WordNet") {
  return {
    id: uid("tab"),
    name,
    pan: {x: 0, y: 0},
    nodes: [
      {id:uid("n"), word:"happy", type:"adjective",
       definition:"feeling pleasure or joy", x:420, y:300},
      {id:uid("n"), word:"joyful", type:"adjective",
       definition:"full of joy", x:650, y:210},
      {id:uid("n"), word:"sad", type:"adjective",
       definition:"feeling sorrow", x:650, y:410}
    ],
    edges: []
  };
}

function loadTabs() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed.tabs) && parsed.tabs.length) {
        if (!parsed.activeTabId || !parsed.tabs.some(t => t.id === parsed.activeTabId)) {
          parsed.activeTabId = parsed.tabs[0].id;
        }
        return parsed;
      }
    }
  } catch(e) {}

  const first = makeDefaultTab();
  return {tabs:[first], activeTabId:first.id};
}

function saveTabs() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tabsData));
}

function getActiveTab() {
  return tabsData.tabs.find(t => t.id === activeTabId) || tabsData.tabs[0];
}

function data() {
  return getActiveTab();
}

function switchTab(id) {
  const current = getActiveTab();
  if (current) current.pan = pan;

  const target = tabsData.tabs.find(t => t.id === id);
  if (!target) return;

  activeTabId = id;
  tabsData.activeTabId = id;
  pan = target.pan || {x:0, y:0};
  selected = null;
  saveTabs();
  render();
}

function addTab() {
  const current = getActiveTab();
  if (current) current.pan = pan;

  const name = prompt("New tab name:", "New WordNet");
  if (name === null) return;

  const tab = makeDefaultTab(name.trim() || "New WordNet");
  tabsData.tabs.push(tab);
  activeTabId = tab.id;
  tabsData.activeTabId = tab.id;
  pan = tab.pan;
  selected = null;
  saveTabs();
  render();
}

function renameTab(id) {
  const tab = tabsData.tabs.find(t => t.id === id);
  if (!tab) return;

  const name = prompt("Rename tab:", tab.name);
  if (name === null) return;

  tab.name = name.trim() || tab.name;
  saveTabs();
  renderTabs();
}

function deleteTab(id) {
  if (tabsData.tabs.length === 1) {
    alert("You must keep at least one tab.");
    return;
  }

  const tab = tabsData.tabs.find(t => t.id === id);
  if (!tab) return;

  if (!confirm(`Delete the tab "${tab.name}" and all words inside it?`)) return;

  tabsData.tabs = tabsData.tabs.filter(t => t.id !== id);

  if (activeTabId === id) {
    activeTabId = tabsData.tabs[0].id;
    tabsData.activeTabId = activeTabId;
    pan = tabsData.tabs[0].pan || {x:0, y:0};
    selected = null;
  }

  saveTabs();
  render();
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";

  for (const tab of tabsData.tabs) {
    const button = document.createElement("button");
    button.className = "tab" + (tab.id === activeTabId ? " active" : "");
    button.textContent = tab.name;
    button.title = "Double-click to rename";

    button.addEventListener("click", () => switchTab(tab.id));
    button.addEventListener("dblclick", e => {
      e.stopPropagation();
      renameTab(tab.id);
    });

    const close = document.createElement("span");
    close.className = "tab-close";
    close.textContent = "×";
    close.title = "Delete tab";
    close.addEventListener("click", e => {
      e.stopPropagation();
      deleteTab(tab.id);
    });

    button.appendChild(close);
    tabsEl.appendChild(button);
  }

  const plus = document.createElement("button");
  plus.id = "newTabButton";
  plus.textContent = "+";
  plus.title = "Add new tab";
  plus.addEventListener("click", addTab);
  tabsEl.appendChild(plus);
}

function getNodes() {
  return getActiveTab().nodes;
}

function getEdges() {
  return getActiveTab().edges;
}

function save() {
  const current = getActiveTab();
  current.pan = pan;
  saveTabs();
  render();
}

function addWord() {
  const word = document.getElementById("wordInput").value.trim();
  if (!word) return alert("Please enter a word.");

  const existing = getNodes().find(n => n.word.toLowerCase() === word.toLowerCase());
  if (existing) {
    alert("That word already exists.");
    selectNode(existing.id);
    return;
  }

  const node = {
    id: uid(),
    word,
    type: document.getElementById("typeInput").value,
    definition: document.getElementById("definitionInput").value.trim(),
    x: 450 + (Math.random() - 0.5) * 250,
    y: 300 + (Math.random() - 0.5) * 200
  };

  getNodes().push(node);
  document.getElementById("wordInput").value = "";
  document.getElementById("definitionInput").value = "";
  save();
  selectNode(node.id);
}

function addConnection() {
  const from = document.getElementById("fromInput").value;
  const to = document.getElementById("toInput").value;
  const relation = document.getElementById("relationInput").value;

  if (!from || !to || from === to) {
    alert("Choose two different words.");
    return;
  }

  const exists = getEdges().some(e =>
    e.from === from && e.to === to && e.relation === relation
  );

  if (!exists) {
    getEdges().push({from, to, relation});
    save();
  }
}

function deleteNode(id) {
  const n = getNodes().find(x => x.id === id);
  if (!n) return;

  if (!confirm(`Delete "${n.word}" and all of its relationships?`)) return;

  getNodes() = getNodes().filter(x => x.id !== id);
  getEdges() = getEdges().filter(e => e.from !== id && e.to !== id);

  if (selected === id) selected = null;

  save();
}

function deleteSelected() {
  if (selected) deleteNode(selected);
}

function editNode(id) {
  const n = getNodes().find(x => x.id === id);
  if (!n) return;

  const word = prompt("Word:", n.word);
  if (word === null) return;
  if (!word.trim()) return;

  const definition = prompt("Definition / note:", n.definition || "");
  if (definition === null) return;

  n.word = word.trim();
  n.definition = definition.trim();
  save();
}

function selectNode(id) {
  selected = id;
  render();
}

function render() {
  renderTabs();
  renderSelects();
  renderGraph();

  const selectedSection = document.getElementById("selectedSection");
  const selectedWord = document.getElementById("selectedWord");
  const selectedNode = getNodes().find(n => n.id === selected);

  if (selectedNode) {
    selectedSection.style.display = "block";
    selectedWord.textContent = selectedNode.word;
  } else {
    selectedSection.style.display = "none";
    selectedWord.textContent = "";
  }

  document.getElementById("stats").textContent =
    `${getNodes().length} words • ${getEdges().length} relationships`;
}

function renderSelects() {
  const ids = ["fromInput", "toInput"];
  for (const id of ids) {
    const el = document.getElementById(id);
    const old = el.value;
    el.innerHTML = getNodes().map(n =>
      `<option value="${escapeHtml(n.id)}">${escapeHtml(n.word)}</option>`
    ).join("");
    if (getNodes().some(n => n.id === old)) el.value = old;
  }
}

function renderGraph() {
  const nodesEl = document.getElementById("nodes");
  const svg = document.getElementById("edges");

  nodesEl.innerHTML = "";
  svg.innerHTML = "";

  // Draw edges first.
  for (const e of getEdges()) {
    const a = getNodes().find(n => n.id === e.from);
    const b = getNodes().find(n => n.id === e.to);
    if (!a || !b) continue;

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", a.x + pan.x);
    line.setAttribute("y1", a.y + pan.y);
    line.setAttribute("x2", b.x + pan.x);
    line.setAttribute("y2", b.y + pan.y);
    line.setAttribute("class", "edge");
    svg.appendChild(line);

    const mx = (a.x + b.x)/2 + pan.x;
    const my = (a.y + b.y)/2 + pan.y;
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", mx);
    label.setAttribute("y", my - 5);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("font-size", "11");
    label.setAttribute("fill", "#777");
    label.textContent = e.relation;
    svg.appendChild(label);
  }

  for (const n of getNodes()) {
    const el = document.createElement("div");
    el.className = "node" + (selected === n.id ? " selected" : "");
    el.style.left = (n.x + pan.x) + "px";
    el.style.top = (n.y + pan.y) + "px";
    el.innerHTML =
      `<div class="word">${escapeHtml(n.word)}</div>` +
      `<div class="type">${escapeHtml(n.type)}</div>` +
      (n.definition ? `<div class="definition">${escapeHtml(n.definition)}</div>` : "") +
      `<button class="nodeDelete" title="Delete this word" aria-label="Delete ${escapeHtml(n.word)}">×</button>`;

    el.addEventListener("click", e => {
      e.stopPropagation();
      selectNode(n.id);
    });

    el.addEventListener("dblclick", e => {
      e.stopPropagation();
      editNode(n.id);
    });

    const deleteButton = el.querySelector(".nodeDelete");
    deleteButton.addEventListener("pointerdown", e => {
      e.preventDefault();
      e.stopPropagation();
      deleteNode(n.id);
    });
    deleteButton.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
    });

    el.addEventListener("pointerdown", e => startNodeDrag(e, n));
    nodesEl.appendChild(el);
  }
}

function startNodeDrag(e, n) {
  e.stopPropagation();
  selected = n.id;
  nodeDrag = {
    id: n.id,
    startX: e.clientX,
    startY: e.clientY,
    originalX: n.x,
    originalY: n.y
  };
  render();
}

function startCanvasDrag(e) {
  if (e.target.closest(".node")) return;
  canvasDrag = {
    startX: e.clientX,
    startY: e.clientY,
    originalX: pan.x,
    originalY: pan.y
  };
  document.getElementById("graph").classList.add("dragging");
}

document.addEventListener("pointermove", e => {
  if (nodeDrag) {
    const n = getNodes().find(x => x.id === nodeDrag.id);
    if (!n) return;
    n.x = nodeDrag.originalX + e.clientX - nodeDrag.startX;
    n.y = nodeDrag.originalY + e.clientY - nodeDrag.startY;
    renderGraph();
  } else if (canvasDrag) {
    pan.x = canvasDrag.originalX + e.clientX - canvasDrag.startX;
    pan.y = canvasDrag.originalY + e.clientY - canvasDrag.startY;
    renderGraph();
  }
});

document.addEventListener("pointerup", () => {
  if (nodeDrag) {
    nodeDrag = null;
    getActiveTab().pan = pan;
    saveTabs();
  }
  if (canvasDrag) {
    canvasDrag = null;
    document.getElementById("graph").classList.remove("dragging");
  }
});

document.getElementById("graph").addEventListener("pointerdown", startCanvasDrag);

document.getElementById("graph").addEventListener("click", e => {
  if (!e.target.closest(".node")) {
    selected = null;
    render();
  }
});

function searchWords() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const result = document.getElementById("searchResults");

  if (!q) {
    result.innerHTML = "";
    return;
  }

  const matches = getNodes().filter(n =>
    n.word.toLowerCase().includes(q) ||
    (n.definition || "").toLowerCase().includes(q)
  );

  result.innerHTML = matches.map(n =>
    `<div class="result" data-id="${escapeHtml(n.id)}">
      <strong>${escapeHtml(n.word)}</strong> — ${escapeHtml(n.type)}
    </div>`
  ).join("");

  result.querySelectorAll(".result").forEach(el => {
    el.onclick = () => selectNode(el.dataset.id);
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify(getActiveTab(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "my-wordnet.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported.nodes) || !Array.isArray(imported.edges)) {
        throw new Error("Invalid format");
      }
      const current = getActiveTab();
      current.nodes = imported.nodes;
      current.edges = imported.edges;
      current.pan = imported.pan || {x:0, y:0};
      pan = current.pan;
      saveTabs();
      render();
      alert("WordNet imported into the current tab.");
    } catch (e) {
      alert("Could not import this JSON file.");
    }
  };
  reader.readAsText(file);
}

function clearAll() {
  if (!getNodes().length && !getEdges().length) {
    alert("The WordNet is already empty.");
    return;
  }

  if (!confirm("Clear ALL words and relationships? This cannot be undone.")) return;

  const current = getActiveTab();
  current.nodes = [];
  current.edges = [];
  selected = null;
  pan = {x: 0, y: 0};
  current.pan = pan;
  saveTabs();

  document.getElementById("searchInput").value = "";
  document.getElementById("searchResults").innerHTML = "";

  render();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

document.addEventListener("keydown", e => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if ((e.key === "Delete" || e.key === "Backspace") && selected) {
    e.preventDefault();
    deleteNode(selected);
  }
});

render();
</script>
</body>
</html>
