const TOPICS=['統計分析／圖表','代數／方程式','幾何','數論／整數','算術／數字運算','比例／百分比／應用題','機率／計數'];
const KEY='monkey112-progress-v1'; let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
let mode='all', current=1;
const $=id=>document.getElementById(id);const question=id=>QUESTIONS[id-1];const state=id=>{let s=data[id]||(data[id]={wrong:0,attempts:0,correct:0,topic:question(id).topic,resolved:false,last:null});if(!TOPICS.includes(s.topic))s.topic=question(id).topic;return s};
function save(){localStorage.setItem(KEY,JSON.stringify(data)); renderStats()}
for(let i=1;i<=112;i++)$('jump').add(new Option('第 '+i+' 題',i));for(let i=1;i<=38;i++)$('page').add(new Option('第 '+i+' 頁',i));
function activeIds(){return mode==='wrong'?QUESTIONS.filter(q=>state(q.id).wrong>0&&!state(q.id).resolved).map(q=>q.id):QUESTIONS.map(q=>q.id)}
function setPage(){const q=question(current);let p=Number($('page').value)||q.page;$('pageLabel').textContent=p;$('pageImage').src='pages/page-'+String(p).padStart(2,'0')+'.jpg'}
function render(){current=Math.max(1,Math.min(112,current));$('jump').value=current;const q=question(current),s=state(current);$('qtitle').textContent=`第 ${current} 題`;const ids=activeIds();let ix=ids.indexOf(current);$('qhint').textContent=mode==='wrong'?`錯題重做 · ${Math.max(ix+1,1)} / ${ids.length} 題 · 曾錯 ${s.wrong} 次`:`共 112 題 · 曾錯 ${s.wrong} 次${s.resolved?' · 已掌握':''}`;$('topic').value=s.topic||'';
$('options').innerHTML='';for(const letter of 'ABCDE'){let b=document.createElement('button');b.className='opt';b.textContent=letter;b.onclick=()=>answer(letter);if(s.last){if(letter===q.answer)b.classList.add('correct');if(letter===s.last&&!s.lastCorrect)b.classList.add('wrong');if(letter===s.last&&s.lastCorrect)b.classList.add('chosen')}$('options').append(b)}
let result=$('result');result.className='result';if(s.last){const correct=s.lastCorrect;result.classList.add(correct?'ok':'no');result.innerHTML=correct?`答對了！正確答案是 <b>${q.answer}</b>。`:`答錯了。你選 <b>${s.last}</b>，正確答案是 <b>${q.answer}</b>。`+(s.resolved?' 這題已標記為掌握。':' 題目已加入錯題紀錄。')}else result.textContent='請先查看題目，再選擇答案。';$('page').value=q.page;$('page').onchange=setPage;setPage();$('wrongCount').textContent=QUESTIONS.filter(x=>state(x.id).wrong>0&&!state(x.id).resolved).length;renderStats();renderMistakes()}
function answer(choice){let q=question(current),s=state(current);s.attempts++;s.last=choice;s.lastCorrect=choice===q.answer;if(s.lastCorrect){s.correct++;if(s.wrong>0)s.resolved=true}else{s.wrong++;s.resolved=false}save();render()}
function renderStats(){let arr=QUESTIONS.map(q=>state(q.id)),pending=arr.filter(s=>s.wrong>0&&!s.resolved).length,wrong=arr.reduce((a,s)=>a+s.wrong,0),attempts=arr.reduce((a,s)=>a+s.attempts,0),correct=arr.reduce((a,s)=>a+s.correct,0);$('pending').textContent=pending;$('wrongTotal').textContent=wrong;$('answered').textContent=arr.filter(s=>s.attempts>0).length;$('accuracy').textContent=attempts?Math.round(correct/attempts*100)+'%':'0%';drawChart()}
function drawChart(){const c=$('chart'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;ctx.scale(dpr,dpr);const w=r.width,h=r.height;ctx.clearRect(0,0,w,h);const counts=TOPICS.map(t=>QUESTIONS.reduce((a,q)=>{let s=state(q.id);return a+(s.topic===t?s.wrong:0)},0));const max=Math.max(1,...counts),left=36,right=8,top=10,bottom=54,plotH=h-top-bottom,slot=(w-left-right)/TOPICS.length,bw=Math.max(12,slot*.55);ctx.font='11px system-ui';ctx.textAlign='center';counts.forEach((n,i)=>{let bh=n/max*(plotH-8),x=left+i*slot+(slot-bw)/2,y=top+plotH-bh;ctx.fillStyle=n?'#536de0':'#dce2ef';ctx.beginPath();ctx.roundRect(x,y,bw,bh,4);ctx.fill();ctx.fillStyle='#475467';ctx.fillText(String(n),x+bw/2,y-4);let label=TOPICS[i].replace('／','/').replace('資料解讀','資料').replace('方程式','方程').replace('算術','算術');let words=label.split('/');ctx.fillText(words[0],x+bw/2,h-34);if(words[1])ctx.fillText(words[1],x+bw/2,h-19)});ctx.strokeStyle='#e4e7ec';ctx.beginPath();ctx.moveTo(left,top+plotH);ctx.lineTo(w-right,top+plotH);ctx.stroke()}
function renderMistakes(){let box=$('mistakeList'),ms=QUESTIONS.filter(q=>state(q.id).wrong>0).sort((a,b)=>Number(state(b.id).resolved)-Number(state(a.id).resolved)||a.id-b.id);if(!ms.length){box.innerHTML='<div class="empty">目前沒有錯題。答錯的題目會列在這裡。</div>';return}box.innerHTML='';ms.forEach(q=>{let s=state(q.id),el=document.createElement('div');el.className='mistake';let label=document.createElement('div');label.innerHTML=`<b>第 ${q.id} 題</b><small>${s.topic||'尚未標記領域'} · 錯 ${s.wrong} 次 · ${s.resolved?'已掌握':'待重做'}</small>`;let b=document.createElement('button');b.textContent='前往';b.onclick=()=>{mode='all';$('allTab').classList.add('active');$('wrongTab').classList.remove('active');current=q.id;render();window.scrollTo({top:0,behavior:'smooth'})};el.append(label,b);box.append(el)})}
$('jump').onchange=e=>{current=Number(e.target.value);render()};$('allTab').onclick=()=>{mode='all';$('allTab').classList.add('active');$('wrongTab').classList.remove('active');render()};$('wrongTab').onclick=()=>{mode='wrong';$('wrongTab').classList.add('active');$('allTab').classList.remove('active');let ids=activeIds();if(ids.length){current=ids[0];render()}else{render();$('result').textContent='沒有待重做的錯題。'}};
$('prev').onclick=()=>{let ids=activeIds(),i=ids.indexOf(current);if(i>0)current=ids[i-1];else if(mode==='all')current=Math.max(1,current-1);render()};$('next').onclick=()=>{let ids=activeIds(),i=ids.indexOf(current);if(i>=0&&i<ids.length-1)current=ids[i+1];else if(mode==='all')current=Math.min(112,current+1);render()};
$('markBtn').onclick=()=>{state(current).topic=$('topic').value;save();render();};$('clearAnswer').onclick=()=>{let s=state(current);s.last=null;s.lastCorrect=null;save();render()};$('reset').onclick=()=>{if(confirm('確定清除所有作答與錯題紀錄？')){data={};save();render()}};window.addEventListener('resize',drawChart);render();
</script></body></html>
